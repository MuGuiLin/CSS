<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>纯CSS 3D环形轮播效果</title>
    <style>
        /* 背景与整体布局 */
        body {
            margin: 0;
            height: 100vh;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* 3D 舞台容器 */
        .stage {
            position: relative;
            width: 300px;
            height: 200px;
            perspective: 1000px; /* 景深，数值越小透视效果越强 */
        }

        /* 旋转的环形容器 */
        .ring {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d; /* 保持子元素的 3D 空间 */
            animation: rotateRing 15s linear infinite; /* 自动旋转动画 */
        }

        /* 环形上的每个卡片项 */
        .item {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 120px;
            height: 60px;
            margin-left: -60px;
            margin-top: -30px;
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.3), rgba(0, 80, 200, 0.6));
            border: 1px solid rgba(0, 200, 255, 0.6);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.4);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            text-align: center;
            /*backface-visibility: hidden; /* 背面不可见 */
        }

        /* 利用 CSS 变量和数学函数，或直接手动计算角度与半径排布卡片 */
        /* 假设总共有 7 个元素：360度 / 7 = 50度 */
        .item:nth-child(1) { transform: rotateY(0deg) translateZ(250px); }
        .item:nth-child(2) { transform: rotateY(50deg) translateZ(250px); }
        .item:nth-child(3) { transform: rotateY(100deg) translateZ(250px); }
        .item:nth-child(4) { transform: rotateY(150deg) translateZ(250px); }
        .item:nth-child(5) { transform: rotateY(200deg) translateZ(250px); }
        .item:nth-child(6) { transform: rotateY(250deg) translateZ(250px); }
        .item:nth-child(7) { transform: rotateY(300deg) translateZ(250px); }

        /* 关键帧动画：让环绕 Y 轴旋转 360 度 */
        @keyframes rotateRing {
            from {
                transform: rotateX(-15deg) rotateY(0deg);
            }
            to {
                transform: rotateX(-15deg) rotateY(-360deg);
            }
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="ring">
            <div class="item">阿里云</div>
            <div class="item">华为云</div>
            <div class="item">腾讯云</div>
            <div class="item">百度云</div>
            <div class="item">火山引擎</div>
            <div class="item">天翼云</div>
            <div class="item">番茄云</div>
        </div>
    </div>

</body>
</html>
