<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>纯CSS 3D环形轮播（完美独立层级版）</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            
            --total: 7;
            --duration: 16s;
            --radius: 320px;
        }

        .stage {
            position: relative;
            width: 300px;
            height: 200px;
            perspective: 1000px; /* 3D 景深 */
        }

        /* 整个舞台：倾斜一个俯视角度，并负责整体绕 Y 轴旋转（公转大环） */
        .ring {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(15deg);
            animation: rotateRing var(--duration) linear infinite;
        }

        .stage:hover .ring {
            animation-play-state: paused;
        }

        /* 每个卡片项的“定位包裹层”：只负责把它摆在环上的固定坐标位置 */
        .item-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            
            /* 核心：静态推开到圆环对应的角度和半径距离 */
            transform: rotateY(calc(360deg / var(--total) * var(--i))) translateZ(var(--radius));
        }

        /* 真正的卡片本体：负责反向自转，抵消外环的旋转，从而永远正对屏幕 */
        .item {
            position: absolute;
            left: -65px;  /* 宽度 130px 的一半 */
            top: -32.5px; /* 高度 65px 的一半 */
            width: 130px;
            height: 65px;
            
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.35), rgba(0, 80, 200, 0.7));
            border: 1px solid rgba(0, 200, 255, 0.7);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.4);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;

            /* 核心动画：反向自转，大小和外环一致、方向相反 */
            animation: faceFront var(--duration) linear infinite;
        }

        .item:hover {
            border-color: #fff;
            box-shadow: 0 0 25px rgba(0, 200, 255, 0.9);
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.55), rgba(0, 100, 240, 0.85));
        }

        /* 给 7 个包裹层分配索引 */
        .item-wrapper:nth-child(1) { --i: 0; }
        .item-wrapper:nth-child(2) { --i: 1; }
        .item-wrapper:nth-child(3) { --i: 2; }
        .item-wrapper:nth-child(4) { --i: 3; }
        .item-wrapper:nth-child(5) { --i: 4; }
        .item-wrapper:nth-child(6) { --i: 5; }
        .item-wrapper:nth-child(7) { --i: 6; }

        /* 1. 大环整体旋转（顺时针或逆时针） */
        @keyframes rotateRing {
            from {
                transform: rotateX(15deg) rotateY(0deg);
            }
            to {
                transform: rotateX(15deg) rotateY(360deg);
            }
        }

        /* 2. 卡片本体反向自转：外环转 +360deg，卡片就转 -360deg 完美抵消 */
        @keyframes faceFront {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(-360deg);
            }
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="ring">
            <div class="item-wrapper"><div class="item">阿里云</div></div>
            <div class="item-wrapper"><div class="item">华为云</div></div>
            <div class="item-wrapper"><div class="item">腾讯云</div></div>
            <div class="item-wrapper"><div class="item">百度云</div></div>
            <div class="item-wrapper"><div class="item">火山引擎</div></div>
            <div class="item-wrapper"><div class="item">天翼云</div></div>
            <div class="item-wrapper"><div class="item">番茄云</div></div>
        </div>
    </div>

</body>
</html>
