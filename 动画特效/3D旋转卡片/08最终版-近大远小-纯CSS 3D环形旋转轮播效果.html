<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>纯CSS 3D环形轮播（无缝衔接 + 强透视近大远小）</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;

            --total: 8;
            --duration: 18s;
            --radius: 280px;   /* 半径 */
            --tilt: -18deg;    /* 俯视倾角 */
            --dir: -1;         /* -1 反向旋转，1 正向旋转 */
        }

        .stage {
            position: relative;
            width: 300px;
            height: 200px;
            /* 核心控制：景深设小一点（如 550px），自然产生极强的“近大远小”差距 */
            perspective: 550px; 
        }

        .ring {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: orbitRing var(--duration) linear infinite;
        }

        .stage:hover .ring,
        .stage:hover .item {
            animation-play-state: paused;
        }

        .item-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;

            --angle: calc(360deg / var(--total) * var(--i));
            transform: rotateY(var(--angle)) translateZ(var(--radius)) rotateY(calc(-1 * var(--angle)));
        }

        .item {
            position: absolute;
            /* 因为近处放大倍数变高，基础尺寸稍微收小一点点，避免正面过大遮挡 */
            left: -50px;
            top: -25px;
            width: 100px;
            height: 50px;

            background: linear-gradient(135deg, rgba(0, 150, 255, 0.35), rgba(0, 80, 200, 0.75));
            border: 1px solid rgba(0, 200, 255, 0.75);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.45);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;

            animation: keepFront var(--duration) linear infinite;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .item:hover {
            border-color: #fff;
            box-shadow: 0 0 25px rgba(0, 200, 255, 0.95);
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.6), rgba(0, 100, 240, 0.9));
        }

        .item-wrapper:nth-child(1) { --i: 0; }
        .item-wrapper:nth-child(2) { --i: 1; }
        .item-wrapper:nth-child(3) { --i: 2; }
        .item-wrapper:nth-child(4) { --i: 3; }
        .item-wrapper:nth-child(5) { --i: 4; }
        .item-wrapper:nth-child(6) { --i: 5; }
        .item-wrapper:nth-child(7) { --i: 6; }
        .item-wrapper:nth-child(8) { --i: 7; }

        /* 补全 25%、50%、75% 关键帧，确保 360 度旋转路径绝对平滑、首尾完美闭合 */
        @keyframes orbitRing {
            0%   { transform: rotateX(var(--tilt)) rotateY(0deg); }
            25%  { transform: rotateX(var(--tilt)) rotateY(calc(90deg * var(--dir))); }
            50%  { transform: rotateX(var(--tilt)) rotateY(calc(180deg * var(--dir))); }
            75%  { transform: rotateX(var(--tilt)) rotateY(calc(270deg * var(--dir))); }
            100% { transform: rotateX(var(--tilt)) rotateY(calc(360deg * var(--dir))); }
        }

        @keyframes keepFront {
            0%   { transform: rotateY(0deg) rotateX(calc(-1 * var(--tilt))); }
            25%  { transform: rotateY(calc(-90deg * var(--dir))) rotateX(calc(-1 * var(--tilt))); }
            50%  { transform: rotateY(calc(-180deg * var(--dir))) rotateX(calc(-1 * var(--tilt))); }
            75%  { transform: rotateY(calc(-270deg * var(--dir))) rotateX(calc(-1 * var(--tilt))); }
            100% { transform: rotateY(calc(-360deg * var(--dir))) rotateX(calc(-1 * var(--tilt))); }
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="ring">
            <div class="item-wrapper"><div class="item">阿里云</div></div>
            <div class="item-wrapper"><div class="item">华为云</div></div>
            <div class="item-wrapper"><div class="item">腾讯云</div></div>
            <div class="item-wrapper"><div class="item">百度云</div></div>
            <div class="item-wrapper"><div class="item">火山引擎</div></div>
            <div class="item-wrapper"><div class="item">天翼云</div></div>
            <div class="item-wrapper"><div class="item">番茄云</div></div>
            <div class="item-wrapper"><div class="item">科大讯飞云</div></div>
        </div>
    </div>

</body>
</html>
