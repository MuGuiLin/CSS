<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>SVG 水波进度（EasyV 同款思路）</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1b2a
        }

        .box {
            width: 160px;
            height: 160px;
            text-align: center
        }

        svg {
            overflow: visible
        }
    </style>
</head>

<body>
    <div class="box" id="box">
        <svg width="100%" height="100%" viewBox="-80 -80 160 160">
            <defs>
                <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#337FEB" />
                    <stop offset="1" stop-color="#10D2ED" />
                </linearGradient>
                <clipPath id="wc">
                    <path id="wpath" d="" />
                </clipPath>
            </defs>

            <circle r="70" fill="rgba(255,255,255,0.06)" stroke="rgba(230,247,255,0.25)" stroke-width="2" />
            <!-- 唯一的水体：圆 + 裁剪 -->
            <circle r="70" clip-path="url(#wc)" fill="url(#wg)" />
            <text id="lbl" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="30" font-weight="bold"
                dy="0">59%</text>
        </svg>
    </div>

    <script>
        const R = 70, WL = 140;          // 半径、波长(=2R)
        const percent = 0.59;
        let tx = 0;

        // 生成"两个波长 + 向下闭合"的波浪路径
        function buildPath(tx) {
            const y = R - 2 * R * percent;     // 水位线 y
            const amp = 12;                // 波幅
            let d = `M ${-R + tx},${y}`;
            for (let i = 0; i < 4; i++) {          // 4 段 q = 2 个完整波长
                const dy = i % 2 === 0 ? amp : -amp;
                d += ` q ${WL / 4},${dy * 2} ${WL / 2},0`;
            }
            d += ` l 0,${2 * R} l ${-2 * WL},0 l 0,${-2 * R}`;
            return d;
        }

        function tick() {
            document.getElementById('wpath').setAttribute('d', buildPath(tx));
            tx -= 0.6;
            if (tx <= -WL) tx = 0;          // 平移一个波长后归位 → 无缝
            requestAnimationFrame(tick);
        }
        document.getElementById('lbl').textContent = Math.round(percent * 100) + '%';
        tick();
    </script>
</body>

</html>
