<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>纯CSS水波进度</title>
    <style>
        /* ① 注册可动画的自定义属性：百分比 + 整数 */
        @property --progress {
            syntax: '<percentage>';
            inherits: true;
            initial-value: 0%;
        }

        @property --num {
            syntax: '<integer>';
            inherits: true;
            initial-value: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1622;
            color: #eaf2f8;
            font-family: system-ui, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
        }

        .box {
            position: relative;
            width: 220px;
            height: 420px;
            background: #061E35;
            border: 1px solid #12395c;
            border-radius: 14px;
            overflow: hidden;

            /* ② 水位与数字都由这两个变量驱动，无限循环 0→100 */
            animation: fill 8s cubic-bezier(.45, .05, .55, .95) infinite;
        }

        @keyframes fill {
            0% {
                --progress: 0%;
                --num: 0;
            }

            85% {
                --progress: 100%;
                --num: 100;
            }

            100% {
                --progress: 100%;
                --num: 100;
            }

            /* 到顶停一下再重来 */
        }

        /* ③ 水体：高度 = 进度 */
        .water {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--progress);
            background: linear-gradient(180deg, #1fb6d8 0%, #1668c7 60%, #0f4c9c 100%);
        }

        /* ④ 唯一一个波面，贴在水面顶部，横向平移形成涌动 */
        .wave {
            position: absolute;
            left: 0;
            bottom: 100%;
            width: 200%;
            height: 48px;
            background-repeat: repeat-x;
            background-size: 50% 100%;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 48' preserveAspectRatio='none'><path d='M -148,30 q 18.5,60 37,0 q 18.5,-60 37,0 q 18.5,60 37,0 q 18.5,-60 37,0 q 18.5,60 37,0 q 18.5,-60 37,0 q 18.5,60 37,0 q 18.5,-60 37,0 L 148,140 L -148,140 Z' fill='%231fb6d8'/></svg>");
            animation: flow 5s linear infinite;
        }

        @keyframes flow {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }

            /* 平移半个元素 = 一个完整波形，无缝 */
        }

        /* ⑤ 百分比文字：整数变量 → counter → content */
        .box::after {
            content: counter(p) '%';
            counter-reset: p var(--num);
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 34px;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .45);
            z-index: 3;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="water">
            <div class="wave"></div>
        </div>
    </div>
</body>

</html>
