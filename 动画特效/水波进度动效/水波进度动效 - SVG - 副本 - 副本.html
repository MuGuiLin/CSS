<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水波进度条动画</title>
    <style>
        /* 1. 基础全局样式 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            /* 整体深色背景，突出卡片 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 2. 卡片容器样式 */
        .card {
            position: relative;
            width: 200px;
            height: 300px;
            background-color: #111e30;
            /* 你的深色卡片背景 */
            border-radius: 20px;
            overflow: hidden;
            /* 限制水波不溢出卡片圆角 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* 3. 进度文字样式 */
        .card-text {
            position: absolute;
            z-index: 10;
            /* 保证文字在最顶层，不被水淹没 */
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            /* 文字阴影增加可读性 */
        }

        /* 4. 水位容器（核心高度控制） */
        .water-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            /* 通过 CSS 变量控制水位高度 */
            height: var(--percent, 59%);
            background: linear-gradient(90deg, #337FEB 0%, #10D2ED 100%);
            
            /* 你的亮蓝色水位底色 */
            z-index: 2;
        }

        /* 5. 波浪层（利用 clip-path 裁剪） */
        .wave-box {
            position: absolute;
            top: -15px;
            /* 将波浪顶部稍微上移，形成露出水面的弧度 */
            left: 0;
            width: 200%;
            /* 两倍宽度，用于无缝滚动 */
            height: 40px;
            background: linear-gradient(90deg, #337FEB 0%, #10D2ED 100%);
            
            /* 波浪高亮部分，增加立体感 */

            /* 关键：引用下方定义的波浪形状 */
            -webkit-clip-path: url(#wave-clip);
            clip-path: url(#wave-clip);
        }

        /* 6. 双层波浪动画配置 */
        .w1 {
            animation: wave-move 8s linear infinite;
        }

        .w2 {
            top: -20px;
            /* 错开一点高度 */
            background-color: rgba(255, 255, 255, 0.05);
            /* 第二层稍微暗一点 */
            animation: wave-move 10s linear infinite reverse;
            /* 方向相反，速度不同 */
        }

        /* 7. 关键帧动画：向左平移 */
        @keyframes wave-move {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        /* 8. 隐藏 SVG 定义区域 */
        .svg-hidden {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- ★ 关键步骤：在页面中定义波浪路径（必须存在且 id 匹配） -->
    <svg class="svg-hidden">
        <defs>
            <!-- 
                d 属性解释：
                M0,0.4 起点
                Q0.125,0 0.25,0.4 上凸弧
                T0.5,0.4 下凹弧（自动延续）
                ...循环至 x=1.0
                L1,1 L0,1 Z 向下、向左、闭合
            -->
            <clipPath id="wave-clip" clipPathUnits="objectBoundingBox">
                <path d="M0,0.4 Q0.125,0 0.25,0.4 T0.5,0.4 T0.75,0.4 T1.0,0.4 L1,1 L0,1 Z" />
            </clipPath>
        </defs>
    </svg>

    <!-- 进度卡片主体 -->
    <div class="card">
        <!-- 居中文字 -->
        <div class="card-text">59%</div>

        <!-- 水位层（修改 --percent 可改变水位高度） -->
        <div class="water-layer" style="--percent: 59%;">
            <div class="wave-box w1"></div> <!-- 第一层波浪 -->
            <div class="wave-box w2"></div> <!-- 第二层波浪 -->
        </div>
    </div>

</body>

</html>
