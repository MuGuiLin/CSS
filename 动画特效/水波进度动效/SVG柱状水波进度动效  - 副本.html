<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG柱状水波进度动效</title>
    <style>
        /* 1. 基础全局样式 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 2. 卡片容器样式 */
        .card {
            margin: 0 auto;
            position: relative;
            width: 200px;
            height: 300px;
            background-color: #111e30;
            /* 你的深色卡片背景 */
            border-radius: 20px;
            overflow: hidden;
            /* 限制水波不溢出卡片圆角 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            border: 1px solid #ffffff;
        }

        /* 3. 进度文字样式 */
        .card-text {
            position: absolute;
            z-index: 10;
            /* 保证文字在最顶层，不被水淹没 */
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            /* 文字阴影增加可读性 */
        }

        /* 4. 水位容器（核心高度控制） */
        .water-layer {
            position: relative;
            /* box-sizing: border-box; */
            margin: 10px;
            width: 100%;
            height: 100%;
            border: 1px solid #ffffff;
            overflow: hidden;
        }

        /* 5. 波浪层（利用 clip-path 裁剪） */
        .wave-box {
            /* 两倍宽度，用于无缝滚动波浪形状 */
            width: 200%;
            height: 300px;
            /* transform: translateY(var(--percent, 0%));   */
            background: linear-gradient(90deg, #337FEB 0%, #10D2ED 100%);
     
            /* 关键：引用下方定义的波浪形状 */
            /* -webkit-clip-path: url(#wave-clip); */
            /* clip-path: url(#waveWide); */
        }


        /* 7. 关键帧动画：循环的向左平移 */
        @keyframes wave-move {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        /* 8. 隐藏 SVG 定义区域 */
        .svg-hidden {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <h1>SVG柱状水波进度动效</h1>
    <hr>
    <!-- ★ 关键步骤：在页面中定义波浪路径（必须存在且 id 匹配） -->
    <svg class="svg-hidden">
        <defs>
            <!-- 
                d 属性解释：
                M0,0.4 起点
                Q0.125,0 0.25,0.4 上凸弧
                T0.5,0.4 下凹弧（自动延续）
                ...循环至 x=1.0
                L1,1 L0,1 Z 向下、向左、闭合
            -->
            <clipPath id="wave-clip" clipPathUnits="objectBoundingBox">
                <path d="M0,0.4 Q0.125,0 0.25,0.4 T0.5,0.4 T0.75,0.4 T1.0,0.4 L1,1 L0,1 Z" />
            </clipPath>
        </defs>
    </svg>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <!--
            clipPathUnits="objectBoundingBox" → 坐标为 0~1 相对值，天然响应式
            横向铺到 x=2，即两个完整周期，配合 translateX(-50%) 无缝
            Q  = 二次贝塞尔（圆弧感来源）
            T  = 平滑延续上一个 Q，省写控制点
            基准 y=0.55 为水位；Q 控制点 y=0.45 与基准差 0.10 即振幅
          -->
            <clipPath id="waveWide" clipPathUnits="objectBoundingBox">
                <path d="M0,0.55
                     Q0.125,0.45 0.25,0.55
                     T0.50,0.55
                     T0.75,0.55
                     T1.00,0.55
                     T1.25,0.55
                     T1.50,0.55
                     T1.75,0.55
                     T2.00,0.55
                     L2,1 L0,1 Z"></path>
            </clipPath>
        </defs>
    </svg>

    <!-- 进度卡片主体 -->
    <div class="card">
        <!-- 居中文字 -->
        <div class="card-text">59%</div>

        <!-- 水位层（修改 --percent 可改变水位高度） -->
        <div class="water-layer" style="--percent: -59%;">
            <div class="wave-box w1"></div>
        </div>
    </div>

</body>

</html>
