<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sci-Fi 3D 双向光线旋转圆环动画</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #131d2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 800px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    .hologram-wrapper {
      position: relative;
      width: 600px;
      height: 600px;
      transform-style: preserve-3d;
      transform: rotateX(78deg);
    }

    /* ================= 1. 顶部顺时针光线旋转层 ================= */
    .glow-ring-top {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(0, 170, 255, 0.08) 0deg,
        rgba(0, 170, 255, 0.08) 220deg,
        rgba(0, 195, 255, 0.5) 310deg,
        rgba(140, 240, 255, 1) 358deg,
        rgba(0, 170, 255, 0.08) 360deg
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff calc(100% - 5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff calc(100% - 5px));
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.9));
      animation: spinLightClockwise 4s linear infinite;
    }

    @keyframes spinLightClockwise {
      0% {
        transform: translateZ(35px) rotateZ(0deg);
      }
      100% {
        transform: translateZ(35px) rotateZ(360deg);
      }
    }

    /* ================= 2. 底部逆时针（反向）光线旋转层 ================= */
    .glow-ring-bottom {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      /* 渐变方向反转：头部在 2deg，拖尾向 140deg 衰减，保证逆时针运动时亮头在前 */
      background: conic-gradient(
        from 0deg,
        rgba(0, 170, 255, 0.08) 0deg,
        rgba(140, 240, 255, 1) 2deg,
        rgba(0, 195, 255, 0.5) 50deg,
        rgba(0, 170, 255, 0.08) 140deg,
        rgba(0, 170, 255, 0.08) 360deg
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff calc(100% - 5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff calc(100% - 5px));
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.85));
      /* 错开速度（如 5s），让上下光束交错感更自然 */
      animation: spinLightCounterClockwise 5s linear infinite;
    }

    @keyframes spinLightCounterClockwise {
      0% {
        /* 初始偏移 180deg，避免一开始就和顶部光线重叠 */
        transform: translateZ(-48px) rotateZ(180deg);
      }
      100% {
        transform: translateZ(-48px) rotateZ(-180deg);
      }
    }

    /* ================= 3. 辅助细线圆环 ================= */
    .wire-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid rgba(70, 150, 210, 0.28);
      pointer-events: none;
    }

    .wire-ring.top {
      transform: translateZ(26px);
    }

    .wire-ring.bottom {
      transform: translateZ(-42px);
    }

    /* ================= 4. 中间分段圆柱面板 ================= */
    .cylinder-body {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .panel {
      position: absolute;
      width: 144px;
      height: 54px;
      left: 50%;
      top: 50%;
      margin-left: -72px;
      margin-top: -27px;
      background: linear-gradient(
        180deg,
        rgba(15, 130, 210, 0.35) 0%,
        rgba(10, 75, 135, 0.2) 50%,
        rgba(15, 130, 210, 0.35) 100%
      );
      border: 1.5px solid rgba(90, 200, 255, 0.65);
      box-shadow: 
        inset 0 0 18px rgba(0, 165, 255, 0.45),
        0 0 8px rgba(0, 150, 255, 0.15);
      backface-visibility: visible;
    }

    .panel:nth-child(1)  { transform: rotateZ(0deg)   rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(2)  { transform: rotateZ(30deg)  rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(3)  { transform: rotateZ(60deg)  rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(4)  { transform: rotateZ(90deg)  rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(5)  { transform: rotateZ(120deg) rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(6)  { transform: rotateZ(150deg) rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(7)  { transform: rotateZ(180deg) rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(8)  { transform: rotateZ(210deg) rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(9)  { transform: rotateZ(240deg) rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(10) { transform: rotateZ(270deg) rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(11) { transform: rotateZ(300deg) rotateX(-90deg) translateZ(290px); }
    .panel:nth-child(12) { transform: rotateZ(330deg) rotateX(-90deg) translateZ(290px); }
  </style>
</head>
<body>

  <div class="stage">
    <div class="hologram-wrapper">
      <!-- 1. 顶部顺时针流光 -->
      <div class="glow-ring-top"></div>

      <!-- 2. 底部逆时针流光 -->
      <div class="glow-ring-bottom"></div>

      <!-- 3. 上下细线轨道 -->
      <div class="wire-ring top"></div>
      <div class="wire-ring bottom"></div>

      <!-- 4. 12块半透明分段面板 -->
      <div class="cylinder-body">
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
      </div>
    </div>
  </div>

</body>
</html>
